# Production / staging stack.
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up --build -d
#
# - db: Postgres with a named volume for durable storage.
# - backend: gunicorn behind config.settings.prod, no bind mounts (immutable
#   image), migrations run automatically via docker/entrypoint.sh on start.
# - frontend: Next.js standalone production server.
#
# Required env vars (see .env.prod.example): SECRET_KEY, ALLOWED_HOSTS,
# CORS_ALLOWED_ORIGINS, DB_NAME, DB_USER, DB_PASSWORD, NEXT_PUBLIC_API_URL.

networks:
  nestmart-network:
    driver: bridge

services:
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - nestmart-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  backend:
    build:
      context: ./backend
      target: prod
    image: nestmart-backend:prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - nestmart-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  frontend:
    build:
      context: ./frontend
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    image: nestmart-frontend:prod
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - nestmart-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  postgres-data:
